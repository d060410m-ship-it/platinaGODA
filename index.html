<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Платина года 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0d12;--panel:#14161d;--slot:#1c1f29;--slot2:#262a37;--line:#3a3f52;--gold:#f2c14e;--gold2:#ff9d3c;--ice:#7fd4ff;--text:#eef0f6;--mute:#8b90a3;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 500px at 15% -10%,#3b2a0d88,transparent 60%),radial-gradient(800px 500px at 100% 10%,#12324788,transparent 60%);pointer-events:none;z-index:-1}
h1,h2{font-family:Unbounded,Impact,sans-serif;margin:0;text-align:center;text-transform:uppercase}
.hero{min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.hero h1{font-size:clamp(40px,10vw,120px);line-height:1;font-weight:800;background:linear-gradient(180deg,#fff2c4,var(--gold) 45%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.hero p{max-width:520px;color:var(--mute);font-size:18px;line-height:1.5;margin:22px 0 34px;animation:rise 1s .2s cubic-bezier(.2,.8,.2,1) both}
.cup{font-size:clamp(70px,12vw,120px);filter:drop-shadow(0 0 30px #f2c14e88);animation:float 4s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-12px) rotate(3deg)}}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{position:relative;overflow:hidden;border:2px solid var(--gold);background:transparent;color:var(--gold);font:700 16px Manrope,sans-serif;padding:14px 28px;border-radius:14px;cursor:pointer;transition:color .45s cubic-bezier(.2,.8,.2,1),transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .45s;z-index:0}
.btn::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transform:translateX(-101%);transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:-1}
.btn:hover,.btn:focus-visible{color:#1a1204;transform:translateY(-4px) scale(1.04);box-shadow:0 12px 30px #f2c14e44;outline:none}
.btn:hover::before,.btn:focus-visible::before{transform:none}
.btn:active{transform:translateY(0) scale(.97)}
.btn.ghost{border-color:var(--line);color:var(--text)}
.btn.ghost::before{background:linear-gradient(90deg,#33384a,#4a5068)}
.btn.ghost:hover{color:#fff;box-shadow:0 12px 30px #0008}
.btn.sm{padding:10px 16px;font-size:14px;border-radius:10px}
section{padding:60px 16px 70px}
.title{font-size:clamp(28px,5vw,56px);font-weight:800;letter-spacing:.02em;margin-bottom:30px;background:linear-gradient(180deg,#fff,#c9ccd8);-webkit-background-clip:text;background-clip:text;color:transparent}
.title.bot{margin:34px 0 0;background:none;color:var(--mute);font-size:clamp(22px,4vw,44px)}
.panel{max-width:1400px;margin:0 auto;background:var(--panel);border:1px solid #232634;border-radius:24px;padding:28px;overflow-x:auto;box-shadow:0 30px 80px #0008}
.bracket{display:flex;gap:48px;height:800px;min-width:1230px;position:relative;padding-right:20px}
.col{display:flex;flex-direction:column;width:250px;flex:none}
.g{flex:1;display:grid;grid-template-rows:1fr 1fr;position:relative}
.g.one{grid-template-rows:1fr}
.m{align-self:center;position:relative;background:var(--slot2);border-radius:10px;padding:2px;transition:box-shadow .4s,transform .4s}
.m:hover{box-shadow:0 8px 24px #0009;transform:scale(1.03)}
.col:not(:last-child) .m::after{content:"";position:absolute;left:100%;top:50%;width:24px;border-top:2px solid var(--line)}
.col:not(:last-child) .g::after{content:"";position:absolute;left:calc(100% + 24px);top:25%;bottom:25%;border-left:2px solid var(--line)}
.col:not(:last-child) .g::before{content:"";position:absolute;left:calc(100% + 24px);width:24px;top:50%;border-top:2px solid var(--line)}
.s{display:flex;align-items:center;height:40px;background:var(--slot);border-radius:8px;margin:1px 0;overflow:hidden;transition:background .4s,opacity .4s,box-shadow .4s}
.s:focus-within{box-shadow:inset 0 0 0 2px var(--ice)}
.sd{width:30px;align-self:stretch;display:grid;place-items:center;background:#11131a;color:var(--mute);font:700 12px Unbounded,sans-serif;flex:none;transition:background .3s,color .3s}
.s img{height:100%;width:62px;object-fit:cover;flex:none;display:none}
.s input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:700 13px Manrope,sans-serif;padding:0 8px;height:100%;outline:none;text-overflow:ellipsis}
.s input[readonly]{cursor:default}
.s button{display:none;width:28px;height:28px;margin-right:4px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--mute);font-size:13px;cursor:pointer;flex:none;opacity:.35;transform:scale(.85);transition:all .35s cubic-bezier(.2,.8,.2,1)}
body.admin .s button{display:block}
body.admin .col:first-child .sd{cursor:pointer}
body.admin .col:first-child .sd:hover{background:#2c3040;color:#fff}
.sd.sel{background:var(--ice)!important;color:#05202e!important}
.s:hover button,.s button:focus-visible{opacity:1;transform:scale(1)}
.s button:hover:not(:disabled){background:var(--gold);color:#1a1204;border-color:var(--gold);transform:scale(1.18) rotate(-8deg);box-shadow:0 0 16px #f2c14e88}
.s button:disabled{cursor:not-allowed}
.s.win{background:linear-gradient(90deg,#5a4313,#8a6417)}
.s.win button{opacity:1;background:var(--gold);color:#1a1204;border-color:var(--gold);transform:scale(1)}
.s.lose{opacity:.45}
.fin{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:absolute;right:0;top:0;width:250px;height:calc(50% - 60px);text-align:center}
.trophy{font-size:80px;transition:all .8s cubic-bezier(.2,.8,.2,1);filter:grayscale(1) opacity(.4)}
.trophy.on{filter:drop-shadow(0 0 28px #f2c14e);animation:float 3s ease-in-out infinite}
.champ{font:800 18px Unbounded,sans-serif;color:var(--gold);min-height:26px;word-break:break-word}
.fin img{width:200px;border-radius:10px;display:none;box-shadow:0 10px 30px #000a}
footer{text-align:center;color:var(--mute);padding:0 16px 40px;font-size:14px}
footer a{color:var(--mute);cursor:pointer;text-decoration:underline;transition:color .3s}
footer a:hover{color:var(--gold)}
/* admin */
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:none}
body.admin .fab{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:#10121a;border-left:1px solid #262a3a;z-index:40;transform:translateX(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px;gap:14px;box-shadow:-20px 0 60px #000a}
.drawer.open{transform:none}
.drawer h3{font:800 18px Unbounded,sans-serif;margin:0}
.dh{display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;color:var(--mute);font-size:26px;cursor:pointer;transition:transform .3s,color .3s}
.x:hover{color:#fff;transform:rotate(90deg)}
.in{width:100%;background:var(--slot);border:1.5px solid var(--line);border-radius:10px;color:var(--text);font:600 15px Manrope,sans-serif;padding:12px 14px;outline:none;transition:border-color .3s,box-shadow .3s}
.in:focus{border-color:var(--ice);box-shadow:0 0 0 3px #7fd4ff22}
.st{font-size:13px;color:var(--mute);min-height:18px}
.st.err{color:#ff7b7b}
.games{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;padding-right:4px}
.card{background:var(--slot);border:1.5px solid transparent;border-radius:10px;padding:0;cursor:pointer;color:var(--text);text-align:left;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .35s}
.card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 10px 24px #000a}
.card img{width:100%;display:block;aspect-ratio:460/215;object-fit:cover;background:#0b0c11}
.card span{display:block;padding:8px 10px;font:700 12px Manrope,sans-serif;line-height:1.3}
.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);display:grid;place-items:center;z-index:60;opacity:0;pointer-events:none;transition:opacity .4s}
.modal.open{opacity:1;pointer-events:auto}
.box{width:min(380px,92vw);background:var(--panel);border:1px solid #2a2e40;border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:14px;transform:translateY(20px) scale(.96);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.modal.open .box{transform:none}
.box h3{font:800 18px Unbounded,sans-serif;margin:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="cup">🏆</div>
  <h1>Платина года</h1>
  <p>Выбери лучшую платину 2026. Смотри, кто дошёл до финала турнира.</p>
  <div class="row"><button class="btn" id="go">К турниру</button></div>
</header>

<section id="tour">
  <h2 class="title">Ваши платины 2026</h2>
  <div class="panel"><div class="bracket" id="br"></div></div>
  <h2 class="title bot">Турнир ваших платин</h2>
</section>
<footer><a id="alink">Вход для админа</a></footer>

<button class="btn fab" id="fab">Админ-панель</button>

<aside class="drawer" id="dr">
  <div class="dh"><h3>Админ-панель</h3><button class="x" id="dx" aria-label="Закрыть">×</button></div>
  <input class="in" id="prof" placeholder="Профиль Steam: ссылка, ник или SteamID">
  <button class="btn sm" id="scan">Найти платины</button>
  <div class="st" id="sst">Выбери слот (номер слева) и нажми на игру.</div>
  <div class="games" id="gm"></div>
  <div class="row">
    <button class="btn sm ghost" id="dl">Скачать data.json</button>
    <button class="btn sm ghost" id="imp">Загрузить data.json</button>
    <button class="btn sm ghost" id="rnd">Случайные победители</button>
    <button class="btn sm ghost" id="rst">Сбросить к опубликованному</button>
    <button class="btn sm ghost" id="out">Выйти</button>
  </div>
  <input type="file" id="file" accept=".json,application/json" hidden>
</aside>

<div class="modal" id="md">
  <div class="box">
    <h3>Вход для админа</h3>
    <input class="in" id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
    <div class="st err" id="lerr"></div>
    <div class="row"><button class="btn sm" id="lg">Войти</button><button class="btn sm ghost" id="lc">Отмена</button></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const SEEDS=[1,16,9,8,5,12,13,4,3,14,11,6,7,10,15,2],sizes=[8,4,2,1];
const EMPTY=()=>({n:Array.from({length:16},()=>({t:"",a:0})),w:[Array(8).fill(null),Array(4).fill(null),Array(2).fill(null),[null]]});
const DK="platina_draft",img=a=>`https://cdn.akamai.steamstatic.com/steam/apps/${a}/header.jpg`;
let st=EMPTY(),admin=false,pw="",sel=0,plat=[];
try{pw=sessionStorage.getItem("pp")||""}catch(e){}
function norm(x){
  try{if(x&&Array.isArray(x.n)&&x.n.length===16&&Array.isArray(x.w)&&x.w.length===4)
    return{n:x.n.map(o=>typeof o==="string"?{t:o,a:0}:{t:String(o.t||""),a:+o.a||0}),w:x.w}}catch(e){}
  return EMPTY();
}
const slot=(r,m,s)=>{if(r===0)return st.n[2*m+s];const p=2*m+s,w=st.w[r-1][p];return w==null?{t:"",a:0}:slot(r-1,p,w)};
const clear=(r,m)=>{if(r<3){const q=m>>1;if(st.w[r+1][q]!=null){st.w[r+1][q]=null;clear(r+1,q)}}};
const save=()=>{if(admin)try{localStorage.setItem(DK,JSON.stringify(st))}catch(e){}};

/* сетка */
const br=$("#br"),refs=[];
sizes.forEach((cnt,r)=>{
  const col=document.createElement("div");col.className="col";refs[r]=[];
  const per=r===3?1:2;
  for(let g=0;g<cnt/per;g++){
    const gr=document.createElement("div");gr.className="g"+(per===1?" one":"");
    for(let k=0;k<per;k++){
      const m=g*per+k,box=document.createElement("div");box.className="m";refs[r][m]=[];
      for(let s=0;s<2;s++){
        const i=2*m+s,row=document.createElement("div");row.className="s";
        const sd=document.createElement("span");sd.className="sd";sd.textContent=r===0?SEEDS[i]:"";
        const im=document.createElement("img");im.alt="";im.onerror=()=>{im.style.display="none"};
        const inp=document.createElement("input");inp.type="text";inp.maxLength=60;inp.setAttribute("aria-label","Платина");inp.readOnly=true;
        const b=document.createElement("button");b.type="button";b.textContent="✓";b.setAttribute("aria-label","Победитель");
        if(r===0){
          sd.onclick=()=>{if(admin){sel=i;upd()}};
          inp.oninput=()=>{st.n[i]={t:inp.value,a:0};save();upd()};
        }
        b.onclick=()=>{if(!slot(r,m,s).t)return;st.w[r][m]=st.w[r][m]===s?null:s;clear(r,m);save();upd()};
        row.append(sd,im,inp,b);box.append(row);refs[r][m][s]={row,sd,im,inp,b};
      }
      gr.append(box);
    }
    col.append(gr);
  }
  br.append(col);
});
const fin=document.createElement("div");fin.className="fin";
fin.innerHTML='<div class="trophy" id="tr">🏆</div><img id="cim" alt=""><div class="champ" id="ch"></div>';
br.append(fin);
$("#cim").onerror=function(){this.style.display="none"};

function upd(){
  refs.forEach((rr,r)=>rr.forEach((ms,m)=>ms.forEach((o,s)=>{
    const v=slot(r,m,s),w=st.w[r][m];
    if(document.activeElement!==o.inp)o.inp.value=v.t;
    o.inp.readOnly=!(admin&&r===0);
    if(v.a){const u=img(v.a);if(o.im.dataset.u!==u){o.im.dataset.u=u;o.im.src=u}o.im.style.display="block"}else{o.im.style.display="none";o.im.dataset.u=""}
    o.row.classList.toggle("win",w===s);
    o.row.classList.toggle("lose",w!=null&&w!==s);
    o.b.disabled=!v.t;
    if(r===0)o.sd.classList.toggle("sel",admin&&sel===2*m+s);
  })));
  const c=st.w[3][0]==null?{t:"",a:0}:slot(3,0,st.w[3][0]);
  $("#ch").textContent=c.t;
  $("#tr").classList.toggle("on",!!c.t);
  const ci=$("#cim");if(c.a){ci.src=img(c.a);ci.style.display="block"}else ci.style.display="none";
}

/* загрузка опубликованных данных */
async function load(){
  let pub=EMPTY();
  try{const r=await fetch("data.json?"+Date.now());if(r.ok)pub=norm(await r.json())}catch(e){}
  st=pub;
  if(admin)try{const d=localStorage.getItem(DK);if(d)st=norm(JSON.parse(d))}catch(e){}
  upd();
}

/* вход */
async function api(body){
  let r,j;
  try{
    r=await fetch("/api/steam",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:pw,...body})});
    j=await r.json();
  }catch(e){throw new Error("Функция не отвечает. Проверь, что папка api (или netlify/functions) загружена на хостинг")}
  if(!r.ok)throw new Error(j.error||("Ошибка "+r.status));
  return j;
}
function setAdmin(on){
  admin=on;document.body.classList.toggle("admin",on);
  if(!on){$("#dr").classList.remove("open");try{sessionStorage.removeItem("pp")}catch(e){}pw=""}
  load();
}
async function login(){
  pw=$("#pw").value;$("#lerr").textContent="";
  try{await api({action:"login"});try{sessionStorage.setItem("pp",pw)}catch(e){}
    $("#md").classList.remove("open");$("#pw").value="";setAdmin(true);$("#dr").classList.add("open")}
  catch(e){pw="";$("#lerr").textContent=e.message}
}
$("#lg").onclick=login;
$("#pw").onkeydown=e=>{if(e.key==="Enter")login()};
$("#lc").onclick=()=>$("#md").classList.remove("open");
const openLogin=()=>{$("#md").classList.add("open");setTimeout(()=>$("#pw").focus(),300)};
$("#alink").onclick=openLogin;
$("#fab").onclick=()=>$("#dr").classList.toggle("open");
$("#dx").onclick=()=>$("#dr").classList.remove("open");
$("#out").onclick=()=>setAdmin(false);
$("#go").onclick=()=>$("#tour").scrollIntoView({behavior:"smooth"});

/* Steam */
function status(t,e){const s=$("#sst");s.textContent=t;s.classList.toggle("err",!!e)}
function showGames(){
  const gm=$("#gm");gm.innerHTML="";
  plat.forEach(g=>{
    const c=document.createElement("button");c.className="card";c.type="button";
    c.innerHTML=`<img alt="" loading="lazy"><span></span>`;
    c.querySelector("img").src=img(g.appid);c.querySelector("span").textContent=g.name;
    c.onclick=()=>{
      st.n[sel]={t:g.name,a:g.appid};
      let nx=st.n.findIndex((x,i)=>i>sel&&!x.t);if(nx<0)nx=st.n.findIndex(x=>!x.t);
      sel=nx<0?sel:nx;save();upd();
    };
    gm.append(c);
  });
}
$("#scan").onclick=async()=>{
  const p=$("#prof").value.trim();if(!p)return;
  const b=$("#scan");b.disabled=true;plat=[];showGames();
  try{
    status("Ищу профиль…");
    const r=await api({action:"games",profile:p});
    const list=r.games.filter(g=>g.playtime>0);
    for(let i=0;i<list.length;i+=8){
      const ch=list.slice(i,i+8),a=await api({action:"achv",steamid:r.steamid,appids:ch.map(g=>g.appid)});
      ch.forEach(g=>{const x=a.results[g.appid];if(x&&x.total>0&&x.got===x.total)plat.push(g)});
      status(`Проверено ${Math.min(i+8,list.length)} из ${list.length}, платин: ${plat.length}`);showGames();
    }
    status(`Готово: платин ${plat.length}. Нажми на игру, чтобы поставить её в выбранный слот.`);
  }catch(e){status(e.message,true)}
  b.disabled=false;
};
$("#prof").onkeydown=e=>{if(e.key==="Enter")$("#scan").click()};

/* инструменты */
$("#dl").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(st,null,1)],{type:"application/json"}));
  a.download="data.json";a.click();URL.revokeObjectURL(a.href);
  status("Скачано. Положи data.json в папку сайта и загрузи папку на Netlify.");
};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{st=norm(JSON.parse(await f.text()));save();upd();status("Файл загружен.")}catch(x){status("Не удалось прочитать файл",true)}
  e.target.value="";
};
$("#rst").onclick=()=>{try{localStorage.removeItem(DK)}catch(e){}load();status("Показаны опубликованные данные.")};
$("#rnd").onclick=()=>{
  for(let r=0;r<4;r++)for(let m=0;m<sizes[r];m++)
    if(st.w[r][m]==null&&slot(r,m,0).t&&slot(r,m,1).t)st.w[r][m]=Math.random()<.5?0:1;
  save();upd();
};
if(location.hash==="#admin")setTimeout(openLogin,400);
(async()=>{
  if(pw){try{await api({action:"login"});admin=true;document.body.classList.add("admin")}catch(e){pw=""}}
  load();
})();
</script>
</body>
</html>
